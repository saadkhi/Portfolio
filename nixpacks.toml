[phases.setup]
nixPkgs = ["python312", "nodejs", "gcc"]

[phases.install]
cmds = ["python -m pip install -r api/requirements.txt || python3 -m pip install -r api/requirements.txt", "cd frontend && npm install"]

[phases.build]
cmds = ["chmod +x build.sh && ./build.sh"]

[start]
cmd = "chmod +x api/start.sh && cd api && ./start.sh"
