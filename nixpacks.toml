providers = ["python", "node"]

[variables]
NIXPACKS_NODE_VERSION = "20"
NIXPACKS_PYTHON_VERSION = "3.11"

[phases.setup]
nixPkgs = ["gcc"]

[phases.install]
cmds = ["python3 -m pip install -r api/requirements.txt", "cd frontend && npm install"]

[phases.build]
cmds = ["chmod +x build.sh && ./build.sh"]

[start]
cmd = "chmod +x api/start.sh && cd api && ./start.sh"
